name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download cloudflared
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --retry-delay 2 -o cloudflared.exe `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

      - name: Smoke test source
        run: npm run smoke

      - name: Build executable
        run: npm run build:exe

      - name: Smoke test executable
        run: npm run smoke:exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiteDrop-windows
          path: |
            dist/LiteDrop.exe
            dist/cloudflared.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --console=plain

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/LiteDrop.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiteDrop-android
          path: dist/LiteDrop.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/LiteDrop.exe
            release/cloudflared.exe
            release/LiteDrop.apk
          generate_release_notes: true
