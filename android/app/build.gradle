plugins {
    id 'com.android.application'
}

android {
    namespace 'com.litedrop.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.litedrop.app'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
